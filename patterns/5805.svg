<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="640" viewBox="0 0 640 640">
  <title>The Swan Hotel, Leighton Buzzard — roses and plumes from the fireplace lounge</title>
  <desc>A square repeat of alternating rose and three-plume roundels, with opposed fleurs-de-lis and small quatrefoils on a navy ground.</desc>
  <defs>
    <g id="roundel">
      <circle r="100" fill="#8E7D7C"/>
      <circle r="94.7" fill="#192A3D"/>
      <circle r="87.8" fill="#8E7D7C"/>
    </g>
    <g id="outer-petal">
      <path d="M -4,-15 C -12,-19 -28,-27 -31,-36 Q -33,-44 -23,-49 C -17,-53 -9,-56 -3,-53 Q 0,-52 2,-50 C 8,-54 16,-51 22,-47 Q 32,-41 28,-34 C 23,-24 12,-19 4,-15 Z" fill="#772F41"/>
      <path d="M -24,-38 Q -23,-46 -12,-48 Q -7,-50 -4,-47 Q -9,-47 -13,-43 Q -18,-43 -20,-37 L -20,-31 Q -24,-33 -24,-38 Z" fill="#A26772"/>
      <path d="M 9,-47 Q 18,-49 22,-42 Q 17,-45 12,-42 Z" fill="#A26772"/>
      <path d="M 22,-36 Q 23,-29 12,-24 Q 16,-29 15,-32 Z" fill="#61293A"/>
    </g>
    <g id="rose-point">
      <path d="M -8,-39 Q -6,-50 0,-60 Q 5,-54 6,-49 L 9,-40 Z" fill="#61293A"/>
    </g>
    <g id="inner-petal">
      <path d="M -5,-6 Q -15,-8 -19,-16 Q -25,-23 -19,-29 C -15,-34 -7,-35 -2,-33 Q 3,-37 11,-33 C 18,-31 23,-25 20,-20 Q 16,-11 6,-7 Z" fill="#772F41"/>
      <path d="M -18,-20 Q -19,-29 -9,-30 L -4,-29 Q -10,-27 -12,-23 L -15,-16 Z" fill="#A26772"/>
      <path d="M 4,-29 Q 12,-32 16,-25 Q 10,-27 5,-25 Z" fill="#A26772"/>
      <path d="M -13,-13 Q -3,-6 10,-12 Q 6,-7 1,-5 Q -9,-7 -13,-13 Z" fill="#61293A"/>
    </g>
    <g id="rose">
      <use xlink:href="#rose-point" transform="rotate(36)"/>
      <use xlink:href="#rose-point" transform="rotate(108)"/>
      <use xlink:href="#rose-point" transform="rotate(180)"/>
      <use xlink:href="#rose-point" transform="rotate(252)"/>
      <use xlink:href="#rose-point" transform="rotate(324)"/>
      <use xlink:href="#outer-petal" transform="rotate(0)"/>
      <use xlink:href="#outer-petal" transform="rotate(72)"/>
      <use xlink:href="#outer-petal" transform="rotate(144)"/>
      <use xlink:href="#outer-petal" transform="rotate(216)"/>
      <use xlink:href="#outer-petal" transform="rotate(288)"/>
      <circle r="31" fill="#61293A"/>
      <use xlink:href="#inner-petal" transform="rotate(36)"/>
      <use xlink:href="#inner-petal" transform="rotate(108)"/>
      <use xlink:href="#inner-petal" transform="rotate(180)"/>
      <use xlink:href="#inner-petal" transform="rotate(252)"/>
      <use xlink:href="#inner-petal" transform="rotate(324)"/>
      <g transform="rotate(0)"><path d="M -2,-1 Q -8,-5 -8,-10 Q -7,-14 -3,-13 Q 0,-16 4,-13 Q 8,-10 5,-6 L 2,-2 Z" fill="#A26772"/></g>
      <g transform="rotate(72)"><path d="M -2,-1 Q -8,-5 -8,-10 Q -7,-14 -3,-13 Q 0,-16 4,-13 Q 8,-10 5,-6 L 2,-2 Z" fill="#A26772"/></g>
      <g transform="rotate(144)"><path d="M -2,-1 Q -8,-5 -8,-10 Q -7,-14 -3,-13 Q 0,-16 4,-13 Q 8,-10 5,-6 L 2,-2 Z" fill="#A26772"/></g>
      <g transform="rotate(216)"><path d="M -2,-1 Q -8,-5 -8,-10 Q -7,-14 -3,-13 Q 0,-16 4,-13 Q 8,-10 5,-6 L 2,-2 Z" fill="#A26772"/></g>
      <g transform="rotate(288)"><path d="M -2,-1 Q -8,-5 -8,-10 Q -7,-14 -3,-13 Q 0,-16 4,-13 Q 8,-10 5,-6 L 2,-2 Z" fill="#A26772"/></g>
      <circle r="4.5" fill="#61293A"/>
      <circle r="2.3" fill="#A26772"/>
    </g>
    <g id="plume">
      <path d="M -3,21 C -7,3 -12,-17 -14,-31 L -12,-29 Q -17,-43 -14,-53 L -11,-50 Q -12,-63 -3,-68 C 5,-73 14,-67 13,-59 Q 12,-52 5,-49 Q 7,-52 7,-55 Q 2,-54 1,-46 L 4,-48 Q 4,-39 -1,-30 L 3,-32 Q 2,-23 -2,-16 C -4,-6 0,11 2,22 Z" fill="#B6A7A7"/>
      <path d="M -4,9 Q -9,-13 -9,-28 C -10,-41 -9,-55 -4,-62 Q -7,-49 -5,-41 L 0,-48 Q -1,-42 -5,-34 Q -6,-24 -4,-18 L -1,-23 L -4,-11 Z" fill="#8E7D7C"/>
    </g>
    <g id="feather-badge">
      <use xlink:href="#plume" transform="translate(-6 0) rotate(-25) scale(1.13 .92)"/>
      <use xlink:href="#plume" transform="translate(8 1) rotate(29) scale(1.09 .91)"/>
      <use xlink:href="#plume" transform="translate(0 -1) scale(1.04 1.04)"/>
      <path d="M -25,1 L -17,6 L -17,0 L -11,7 L -5,4 L 0,10 L 6,4 L 12,8 L 18,0 L 18,7 L 25,2 L 20,18 Q 0,12 -20,19 Z" fill="#B6A7A7"/>
      <path d="M -19,23 Q 0,17 19,23 L 17,29 Q 0,25 -17,30 Z" fill="#B6A7A7"/>
      <path d="M -12,34 L -7,32 L -2,40 L -6,47 L -12,44 Z M -3,32 L 2,30 L 7,44 L 2,49 Z M 6,32 L 12,33 L 15,43 L 10,46 Z" fill="#B6A7A7"/>
      <path d="M -57,47 Q -52,38 -38,40 Q -26,41 -15,48 L -17,55 Q -29,49 -36,50 Q -31,54 -33,59 Q -45,57 -51,53 Z M 17,47 Q 29,38 42,39 Q 51,40 57,46 L 49,55 Q 41,57 34,59 Q 35,54 38,49 Q 31,48 20,55 Z" fill="#B6A7A7"/>
      <path d="M -35,45 Q -22,38 -8,43 Q 7,49 18,42 Q 28,39 37,45 L 33,54 Q 21,50 12,56 Q 2,62 -11,55 Q -22,50 -32,55 Z" fill="#B6A7A7"/>
      <path d="M -23,46 Q -14,44 -7,49 Q -15,47 -23,50 Z M 9,51 Q 18,45 26,46 L 23,49 Q 18,48 9,54 Z" fill="#8E7D7C"/>
    </g>
    <g id="frame-side">
      <path d="M -92,-92 C -69,-66 -34,-51 0,-51 C 34,-51 69,-66 92,-92" fill="none" stroke="#8E7D7C" stroke-width="4.7" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M -16,-54 Q -12,-69 -5,-84 L -2,-87 L 0,-80 Q -8,-71 -11,-53 Z M 16,-54 Q 11,-72 5,-84 L 2,-87 L 0,-80 Q 7,-70 11,-53 Z" fill="#8E7D7C"/>
      <path d="M -2,-78 Q -6,-89 -6,-99 C -8,-113 -5,-131 0,-145 C 6,-133 10,-116 7,-103 L 3,-86 L 2,-78 Z" fill="#8E7D7C"/>
      <path d="M -3,-82 C -5,-91 -11,-99 -18,-101 Q -28,-104 -28,-91 C -35,-94 -37,-104 -34,-113 Q -30,-124 -20,-121 C -10,-119 -8,-111 -6,-103 L -1,-86 Z" fill="#8E7D7C"/>
      <path d="M 3,-82 C 5,-93 11,-100 18,-101 Q 27,-103 28,-92 C 36,-95 37,-105 33,-114 Q 29,-124 19,-121 C 10,-117 8,-110 6,-102 L 1,-86 Z" fill="#8E7D7C"/>
      <path d="M -8,-88 Q 0,-90 8,-88 L 7,-83 Q 0,-81 -7,-83 Z" fill="#8E7D7C"/>
      <path d="M -92,-99 Q -87,-97 -83,-92 L -88,-86 L -94,-83 Q -97,-88 -99,-92 Z" fill="#8E7D7C"/>
    </g>
    <g id="leaf">
      <path d="M -2,0 C -10,-2 -23,-7 -28,-16 Q -35,-27 -29,-34 Q -20,-39 -11,-32 C -4,-27 0,-16 1,-6 Z" fill="#8E7D7C"/>
    </g>
    <g id="quatrefoil">
      <use xlink:href="#frame-side" transform="rotate(0)"/>
      <use xlink:href="#frame-side" transform="rotate(90)"/>
      <use xlink:href="#frame-side" transform="rotate(180)"/>
      <use xlink:href="#frame-side" transform="rotate(270)"/>
      <use xlink:href="#leaf" transform="rotate(0)"/>
      <use xlink:href="#leaf" transform="rotate(90)"/>
      <use xlink:href="#leaf" transform="rotate(180)"/>
      <use xlink:href="#leaf" transform="rotate(270)"/>
      <circle r="5.8" fill="#8E7D7C"/>
    </g>
  </defs>
  <rect width="640" height="640" fill="#192A3D"/>
  <use xlink:href="#quatrefoil" transform="translate(0 0)"/>
  <use xlink:href="#quatrefoil" transform="translate(320 0)"/>
  <use xlink:href="#quatrefoil" transform="translate(640 0)"/>
  <use xlink:href="#quatrefoil" transform="translate(0 320)"/>
  <use xlink:href="#quatrefoil" transform="translate(320 320)"/>
  <use xlink:href="#quatrefoil" transform="translate(640 320)"/>
  <use xlink:href="#quatrefoil" transform="translate(0 640)"/>
  <use xlink:href="#quatrefoil" transform="translate(320 640)"/>
  <use xlink:href="#quatrefoil" transform="translate(640 640)"/>
  <use xlink:href="#roundel" transform="translate(160 160)"/>
  <use xlink:href="#rose" transform="translate(160 160) rotate(6)"/>
  <use xlink:href="#roundel" transform="translate(480 160)"/>
  <use xlink:href="#feather-badge" transform="translate(480 160) rotate(43)"/>
  <use xlink:href="#roundel" transform="translate(160 480)"/>
  <use xlink:href="#feather-badge" transform="translate(160 480) rotate(43)"/>
  <use xlink:href="#roundel" transform="translate(480 480)"/>
  <use xlink:href="#rose" transform="translate(480 480) rotate(6)"/>
</svg>
