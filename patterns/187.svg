      <use xlink:href="#pearl-roundel" transform="translate(71.562 -172.765)" />
      <use xlink:href="#wreath-palmette" transform="rotate(45)" />
      <use xlink:href="#pearl-roundel" transform="translate(172.765 -71.562)" />
      <use xlink:href="#wreath-palmette" transform="rotate(90)" />
      <use xlink:href="#pearl-roundel" transform="translate(172.765 71.562)" />
      <use xlink:href="#wreath-palmette" transform="rotate(135)" />
