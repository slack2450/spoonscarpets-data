<svg xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <title>The Moon Under Water, Wigan — palmette wreaths and eight-point rosettes</title>
  <desc>A square repeat of antique-gold palmettes alternating with pearl-coloured roundels on a blue ground. An eight-point flower occupies the wreath and the space between neighbouring wreaths.</desc>
