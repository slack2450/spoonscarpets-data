<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="308" height="400" viewBox="0 0 308 400">
  <title>The Old Chapel, Darwen — hooked leaves and lozenges</title>
  <defs>
    <path d="M -12,-24&#10; C -23,-31 -40,-47 -46,-61&#10; Q -50,-69 -49,-75&#10; C -40,-77 -30,-79 -30,-87&#10; Q -30,-91 -34,-91&#10; C -37,-86 -46,-86 -50,-91&#10; C -54,-99 -49,-115 -43,-125&#10; Q -39,-132 -34,-135&#10; C -20,-130 -13,-120 -12,-106&#10; C -11,-86 -13,-46 -12,-24 Z" id="upright-left" />
    <path d="M 13,-25&#10; C 26,-32 43,-48 49,-64&#10; Q 52,-72 48,-75&#10; C 38,-80 30,-83 30,-91&#10; C 36,-86 45,-86 49,-91&#10; C 52,-100 45,-121 35,-132&#10; Q 33,-135 30,-134&#10; C 18,-129 13,-122 13,-107&#10; C 12,-84 12,-44 13,-25 Z" id="upright-right" />
    <path d="M 28,-11&#10; C 43,-21 68,-31 92,-41&#10; C 96,-34 103,-26 110,-24&#10; Q 115,-22 117,-26&#10; C 111,-31 110,-37 115,-40&#10; C 125,-46 146,-38 163,-30&#10; Q 170,-27 171,-25&#10; C 164,-18 156,-13 144,-11&#10; C 115,-9 61,-10 28,-11 Z" id="side-upper" />
    <path d="M 29,10&#10; C 57,10 112,9 142,11&#10; C 153,12 164,17 171,24&#10; C 165,32 145,40 129,40&#10; C 120,41 115,36 115,29&#10; C 107,30 99,34 92,42&#10; C 69,35 42,24 29,10 Z" id="side-lower" />
    <g id="diagonal" fill="#4D210E">
      <path d="M 46,-150&#10; C 58,-147 66,-146 79,-146&#10; C 76,-138 79,-126 87,-123&#10; Q 91,-122 96,-125&#10; C 99,-117 103,-109 111,-107&#10; Q 116,-106 122,-109&#10; C 127,-86 141,-66 157,-51&#10; C 143,-54 131,-57 118,-58&#10; C 122,-67 118,-76 111,-78&#10; Q 107,-79 101,-77&#10; C 98,-86 96,-91 90,-93&#10; Q 84,-96 77,-92&#10; C 72,-118 61,-137 46,-150 Z" />
      <path d="M 105,-145&#10; Q 117,-140 131,-146&#10; Q 126,-134 120,-127&#10; C 113,-130 109,-136 105,-145 Z" />
      <path d="M 69,-53&#10; Q 75,-63 78,-72&#10; C 86,-73 91,-68 96,-58&#10; Q 83,-61 69,-53 Z" />
    </g>
    <g id="lozenges">
      <path d="M 0,-24 Q 18,-12 37,0 Q 18,12 0,24 Q -16,13 -37,0 Q -19,-12 0,-24 Z" fill="#783527" />
      <path d="M 0,-63 Q 15,-55 27,-45 Q 14,-35 0,-28 Q -14,-35 -27,-45 Q -13,-55 0,-63 Z" fill="#4D210E" />
      <path d="M 0,28 Q 16,36 27,45 Q 14,56 0,63 Q -16,54 -27,45 Q -14,35 0,28 Z" fill="#4D210E" />
    </g>
    <g id="madder-junction">
      <g transform="rotate(0)">
        <use xlink:href="#upright-left" fill="#4D210E" />
        <use xlink:href="#upright-right" fill="#783527" />
      </g>
      <g transform="rotate(180)">
        <use xlink:href="#upright-left" fill="#4D210E" />
        <use xlink:href="#upright-right" fill="#783527" />
      </g>
      <use xlink:href="#side-upper" fill="#4D210E" />
      <use xlink:href="#side-lower" fill="#3C4B49" />
      <use xlink:href="#side-upper" fill="#4D210E" transform="rotate(180)" />
      <use xlink:href="#side-lower" fill="#AB9136" transform="rotate(180)" />
    </g>
    <g id="teal-junction">
      <g transform="rotate(0)">
        <use xlink:href="#upright-left" fill="#4D210E" />
        <use xlink:href="#upright-right" fill="#3C4B49" />
      </g>
      <g transform="rotate(180)">
        <use xlink:href="#upright-left" fill="#4D210E" />
        <use xlink:href="#upright-right" fill="#AB9136" />
      </g>
      <use xlink:href="#side-upper" fill="#4D210E" />
      <use xlink:href="#side-lower" fill="#3C4B49" />
      <use xlink:href="#side-upper" fill="#4D210E" transform="rotate(180)" />
      <use xlink:href="#side-lower" fill="#AB9136" transform="rotate(180)" />
    </g>
  </defs>
  <rect width="308" height="400" fill="#CEAE70" />
  <g transform="scale(0.77 1)">
    <use xlink:href="#madder-junction" transform="translate(100 -100)" />
    <use xlink:href="#madder-junction" transform="translate(100 300)" />
    <use xlink:href="#madder-junction" transform="translate(500 -100)" />
    <use xlink:href="#madder-junction" transform="translate(500 300)" />
    <use xlink:href="#teal-junction" transform="translate(-100 100)" />
    <use xlink:href="#teal-junction" transform="translate(-100 500)" />
    <use xlink:href="#teal-junction" transform="translate(300 100)" />
    <use xlink:href="#teal-junction" transform="translate(300 500)" />
    <use xlink:href="#lozenges" transform="translate(100 100)" />
    <use xlink:href="#lozenges" transform="translate(300 300)" />
    <use xlink:href="#diagonal" transform="translate(100 -100) scale(-1 -1)" />
    <use xlink:href="#diagonal" transform="translate(100 -100) scale(1 -1)" />
    <use xlink:href="#diagonal" transform="translate(100 300) scale(-1 -1)" />
    <use xlink:href="#diagonal" transform="translate(100 300) scale(-1 1)" />
    <use xlink:href="#diagonal" transform="translate(100 300) scale(1 -1)" />
    <use xlink:href="#diagonal" transform="translate(100 300) scale(1 1)" />
    <use xlink:href="#diagonal" transform="translate(500 -100) scale(-1 -1)" />
    <use xlink:href="#diagonal" transform="translate(500 300) scale(-1 -1)" />
    <use xlink:href="#diagonal" transform="translate(500 300) scale(-1 1)" />
  </g>
</svg>
