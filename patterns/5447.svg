<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="656" height="656" viewBox="0 0 656 656">
  <title>The Watchman, New Malden — window aisle repeat</title>
  <desc>Diagonal rows of fawn star panels alternate with navy ribbon knots around pale, bound crosses.</desc>
  <defs>
    <!-- Each scroll rises off the long bowed side of a knot and folds back to the binding. -->
    <path id="scroll" d="M 2,-121 C 57,-120 110,-139 152,-163 C 129,-185 102,-207 77,-207 C 39,-207 25,-167 23,-131"/>
    <g id="loop">
      <use xlink:href="#scroll" stroke="#252530" stroke-width="28"/>
      <use xlink:href="#scroll" stroke="#756b6b" stroke-width="20"/>
      <use xlink:href="#scroll" stroke="#474654" stroke-width="16"/>
      <use xlink:href="#scroll" stroke="#303347" stroke-width="7"/>
    </g>
    <g id="elbow">
      <use xlink:href="#loop"/>
      <use xlink:href="#loop" transform="matrix(0 -1 -1 0 0 0)"/>
    </g>
    <path id="bowed-square" d="M -164,-164 Q 0,-70 164,-164 Q 70,0 164,164 Q 0,70 -164,164 Q -70,0 -164,-164 Z"/>
    <g id="arm">
      <path fill="#252530" d="M -19,1 L -18,-136 Q -19,-148 -25,-154 Q 0,-161 25,-154 Q 19,-146 18,-136 L 19,1 Z"/>
      <path fill="#756b6b" d="M -12,-7 L -11,-140 Q 0,-144 11,-140 L 12,-7 Z"/>
      <path fill="#ab907d" d="M -7,-12 L -7,-126 Q 0,-131 7,-126 L 7,-12 Z"/>
      <path fill="#474654" d="M -18,-119 Q 0,-125 18,-119 L 18,-108 Q 0,-114 -18,-108 Z M -18,-138 Q 0,-145 18,-138 L 18,-133 Q 0,-139 -18,-133 Z"/>
      <path fill="#c9b7a1" d="M -14,-133 Q 0,-140 14,-133 L 13,-126 Q 0,-131 -13,-126 Z"/>
    </g>
    <g id="knot" stroke-linejoin="round" stroke-linecap="round">
      <use xlink:href="#bowed-square" fill="#303347" stroke="#252530" stroke-width="33"/>
      <use xlink:href="#bowed-square" fill="none" stroke="#ab907d" stroke-width="23"/>
      <use xlink:href="#bowed-square" fill="none" stroke="#474654" stroke-width="17"/>
      <use xlink:href="#bowed-square" fill="none" stroke="#303347" stroke-width="9"/>
      <path d="M -107,-107 Q 0,-74 107,-107 Q 74,0 107,107 Q 0,74 -107,107 Q -74,0 -107,-107 Z"
            fill="none" stroke="#756b6b" stroke-width="6"/>
      <path d="M -105,-105 Q 0,-72 105,-105 Q 72,0 105,105 Q 0,72 -105,105 Q -72,0 -105,-105 Z"
            fill="none" stroke="#ab907d" stroke-width="2"/>
      <g fill="none">
        <use xlink:href="#elbow"/>
        <use xlink:href="#elbow" transform="rotate(90)"/>
        <use xlink:href="#elbow" transform="rotate(180)"/>
        <use xlink:href="#elbow" transform="rotate(270)"/>
      </g>
      <use xlink:href="#arm"/>
      <use xlink:href="#arm" transform="rotate(90)"/>
      <use xlink:href="#arm" transform="rotate(180)"/>
      <use xlink:href="#arm" transform="rotate(270)"/>
      <rect x="-19" y="-19" width="38" height="38" rx="4" fill="#252530"/>
      <rect x="-12" y="-12" width="24" height="24" rx="2" fill="#756b6b"/>
      <rect x="-8" y="-8" width="16" height="16" fill="#ab907d"/>
    </g>
    <g id="spandrel">
      <path fill="#474654" d="M -78,-98 Q -30,-101 -19,-143 Q -11,-160 0,-168 Q 11,-160 19,-143 Q 30,-101 78,-98 Q 0,-72 -78,-98 Z"/>
      <path fill="#977458" d="M -49,-101 Q -21,-116 0,-158 Q 21,-116 49,-101 Q 0,-89 -49,-101 Z"/>
      <path fill="#ab907d" d="M -28,-106 Q -13,-122 0,-144 Q 13,-122 28,-106 Z"/>
    </g>
    <g id="frame">
      <use xlink:href="#spandrel"/>
      <use xlink:href="#spandrel" transform="rotate(90)"/>
      <use xlink:href="#spandrel" transform="rotate(180)"/>
      <use xlink:href="#spandrel" transform="rotate(270)"/>
      <path fill="#ab907d" stroke="#252530" stroke-width="5" d="M -114,-114 Q 0,-84 114,-114 Q 84,0 114,114 Q 0,84 -114,114 Q -84,0 -114,-114 Z"/>
      <rect x="-72" y="-72" width="144" height="144" fill="#977458" stroke="#756b6b" stroke-width="4"/>
      <rect x="-64" y="-64" width="128" height="128" fill="#ab907d"/>
      <path fill="#977458" d="M -64,-64 L -30,-25 -64,-8 Z M 64,-64 L 30,-25 64,-8 Z M 64,64 L 30,25 64,8 Z M -64,64 L -30,25 -64,8 Z"/>
      <path fill="#252530" d="M 0,-69 Q 8,-41 24,-24 Q 43,-10 68,0 Q 43,10 24,24 Q 8,42 0,69 Q -9,40 -24,24 Q -43,10 -68,0 Q -43,-10 -24,-24 Q -9,-42 0,-69 Z"/>
      <path fill="#474654" d="M 0,-56 L 10,-23 0,-9 -10,-23 Z M 55,0 L 23,10 9,0 23,-10 Z M 0,56 L -10,23 0,9 10,23 Z M -55,0 L -23,-10 -9,0 -23,10 Z"/>
      <path fill="#756b6b" d="M 0,-11 L 9,0 0,11 -9,0 Z"/>
    </g>
    <!-- Both versions of the diagonal crossing carry one band continuously across the junction. -->
    <g id="crossing">
      <path d="M -27,27 Q -12,10 0,0 Q 15,-11 27,-27" fill="none" stroke="#252530" stroke-width="16"/>
      <path d="M -27,27 Q -12,10 0,0 Q 15,-11 27,-27" fill="none" stroke="#474654" stroke-width="11"/>
      <path d="M -27,27 Q -12,10 0,0 Q 15,-11 27,-27" fill="none" stroke="#303347" stroke-width="5"/>
    </g>
  </defs>
  <rect width="656" height="656" fill="#303347"/>
  <use xlink:href="#frame" x="328"/>
  <use xlink:href="#frame" x="328" y="656"/>
  <use xlink:href="#frame" y="328"/>
  <use xlink:href="#frame" x="656" y="328"/>
  <use xlink:href="#knot"/>
  <use xlink:href="#knot" x="656"/>
  <use xlink:href="#knot" y="656"/>
  <use xlink:href="#knot" x="656" y="656"/>
  <use xlink:href="#knot" x="328" y="328"/>
  <use xlink:href="#crossing" transform="translate(164 164)"/>
  <use xlink:href="#crossing" transform="translate(492 492)"/>
  <use xlink:href="#crossing" transform="translate(164 492) scale(-1 1)"/>
  <use xlink:href="#crossing" transform="translate(492 164) scale(-1 1)"/>
</svg>
