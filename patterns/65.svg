      <use xlink:href="#bracket"/>
      <use xlink:href="#bracket" transform="rotate(180)"/>
      <use xlink:href="#cap"/>
      <use xlink:href="#cap" transform="rotate(180)"/>
      <path id="petal" fill="#c59383" d="M-1 -31 Q4 -30 3 -22 Q2 -14 -3 -5 Q-7 2 -7 9 Q-8 16 -14 19 Q-19 14 -19 7 Q-19 -4 -13 -14 Q-9 -24 -1 -31Z"/>
