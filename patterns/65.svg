    </g>
    <g id="bracket">
      <path fill="#674032" d="M-38 -40 Q-37 -46 -31 -46 L-26 -42 Q-20 -47 -15 -46 L-12 -40 Q-12 -32 -18 -23 Q-25 -12 -25 0 Q-25 13 -19 23 Q-13 32 -15 39 L-19 45 L-26 41 L-31 45 L-37 43 Q-39 40 -37 29 Q-45 14 -45 1 Q-46 -13 -39 -28 Z"/>
      <path fill="#dda39a" d="M-36 -38 L-31 -41 L-26 -38 L-19 -42 L-16 -38 Q-16 -32 -22 -25 Q-30 -13 -30 -1 Q-31 10 -25 20 L-19 29 Q-16 33 -18 39 L-24 37 L-30 42 L-35 40 L-34 31 Q-34 27 -37 22 Q-44 10 -43 -2 Q-43 -15 -37 -25 Q-34 -30 -36 -38 Z"/>
    </g>
    <g id="cap">
