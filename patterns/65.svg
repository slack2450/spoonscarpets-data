<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
  <title>The Old Manor, Bracknell — crimson carpet with paired pale brackets and seed motifs</title>
  <defs>
    <path id="fleck" fill="#c4374d" d="M-3 -2 L0 -5 L3 -3 L3 2 L0 5 L-3 3 Z"/>
