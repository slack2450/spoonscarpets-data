<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="0 0 512 512">
  <title>The Corn Exchange, Bury St Edmunds — alternating square Axminster frames</title>
  <desc>Copper and wheat rails circle alternate blue squares. Between them, five dusty mauve rings surround a dark central square.</desc>
  <defs>
    <g id="polychrome">
      <rect x="0" y="0" width="256" height="256" fill="#2E3543"/>
      <rect x="91.8" y="91.8" width="72.4" height="72.4" fill="#4B4C59"/>
      <rect x="1.2" y="1.2" width="253.6" height="253.6" fill="none" stroke="#A2949C" stroke-width="2.4"/>
      <rect x="7.7" y="7.7" width="240.6" height="240.6" fill="none" stroke="#BE9078" stroke-width="3.8"/>
      <rect x="15" y="15" width="226" height="226" fill="none" stroke="#A2949C" stroke-width="3.35"/>
      <rect x="22.2" y="22.2" width="211.6" height="211.6" fill="none" stroke="#C6C298" stroke-width="3.7"/>
      <rect x="29.3" y="29.3" width="197.4" height="197.4" fill="none" stroke="#A2949C" stroke-width="3.35"/>
      <rect x="63.5" y="63.5" width="129" height="129" fill="none" stroke="#A2949C" stroke-width="3.5"/>
      <rect x="70.6" y="70.6" width="114.8" height="114.8" fill="none" stroke="#BE9078" stroke-width="3.8"/>
      <rect x="77.7" y="77.7" width="100.6" height="100.6" fill="none" stroke="#A2949C" stroke-width="3.35"/>
      <rect x="84.8" y="84.8" width="86.4" height="86.4" fill="none" stroke="#C6C298" stroke-width="3.7"/>
      <rect x="92" y="92" width="72" height="72" fill="none" stroke="#D5D3D9" stroke-width="3.65"/>
    </g>
    <g id="mauve">
      <rect x="0" y="0" width="256" height="256" fill="#4B4C59"/>
      <rect x="94" y="94" width="68" height="68" fill="#2E3543"/>
      <rect x="1.1" y="1.1" width="253.8" height="253.8" fill="none" stroke="#A2949C" stroke-width="2.2"/>
      <rect x="8" y="8" width="240" height="240" fill="none" stroke="#A2949C" stroke-width="3.4"/>
      <rect x="65.5" y="65.5" width="125" height="125" fill="none" stroke="#A2949C" stroke-width="4.1"/>
      <rect x="72.6" y="72.6" width="110.8" height="110.8" fill="none" stroke="#A2949C" stroke-width="4.1"/>
      <rect x="79.7" y="79.7" width="96.6" height="96.6" fill="none" stroke="#A2949C" stroke-width="4.1"/>
      <rect x="86.8" y="86.8" width="82.4" height="82.4" fill="none" stroke="#A2949C" stroke-width="4.1"/>
      <rect x="93.9" y="93.9" width="68.2" height="68.2" fill="none" stroke="#A2949C" stroke-width="4.1"/>
    </g>
  </defs>
  <rect width="512" height="512" fill="#4B4C59"/>
  <use xlink:href="#polychrome" x="-128" y="-128"/>
  <use xlink:href="#mauve" x="128" y="-128"/>
  <use xlink:href="#polychrome" x="384" y="-128"/>
  <use xlink:href="#mauve" x="-128" y="128"/>
  <use xlink:href="#polychrome" x="128" y="128"/>
  <use xlink:href="#mauve" x="384" y="128"/>
  <use xlink:href="#polychrome" x="-128" y="384"/>
  <use xlink:href="#mauve" x="128" y="384"/>
  <use xlink:href="#polychrome" x="384" y="384"/>
</svg>
