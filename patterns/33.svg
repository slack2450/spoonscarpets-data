      <polygon points="-55,10 55,10 32,50 -31,50" fill="#47657B" />
      <polygon points="-55,-10 55,-10 32,-50 -31,-50" fill="#47657B" />
    </g>
    <g id="cube-face">
      <polygon points="-121,0 -66,-96 61,-96 119,0 61,96 -66,96" fill="#92ACB6" />
      <g transform="scale(1 1) rotate(0)">
        <polygon points="0,-8 122,-8 122,8 0,8" fill="#A18D73" />
      </g>
      <g transform="scale(1 1) rotate(120)">
        <polygon points="0,-8 122,-8 122,8 0,8" fill="#A18D73" />
      </g>
      <g transform="scale(1 1) rotate(240)">
