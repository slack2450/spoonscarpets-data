<?xml version='1.0' encoding='utf-8'?>
<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1108" height="320" viewBox="0 0 1108 320" xmlns="http://www.w3.org/2000/svg">
  <title>The Moon Under Water, Hounslow — interlocking cubes and split hexagons</title>
  <defs>
    <g id="stepped-bands">
      <polygon points="9,10 181,10 263,150 257,151 220,151 160,49 32,49" fill="#47657B" />
      <polygon points="208,0 263,0 291,48 266,90" fill="#47657B" />
      <polygon points="282,98 304,62 329,103 304,140" fill="#47657B" />
      <polygon points="326,153 347,115 480,115 505,71 527,109 503,153" fill="#47657B" />
      <polygon points="540,0 587,0 548,70 524,30" fill="#47657B" />
      <polygon points="545,151 626,10 817,10 796,49 650,49 590,151" fill="#47657B" />
      <polygon points="814,100 838,59 864,104 840,145" fill="#47657B" />
      <polygon points="852,152 874,115 1022,115 1084,9 1106,49 1048,152" fill="#47657B" />
    </g>
    <g id="split-inlays">
