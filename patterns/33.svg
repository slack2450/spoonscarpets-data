      <polygon points="-61,0 -40,-38 -18,0 -40,38" fill="#47657B" />
      <polygon points="-13,50 29,50 52,11 11,11" fill="#47657B" />
      <polygon points="-13,-50 29,-50 52,-11 11,-11" fill="#47657B" />
    </g>
    <g id="forked-face">
