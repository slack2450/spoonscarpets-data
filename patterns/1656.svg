<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="0 0 512 512">
  <title>The Britannia, Rowley Regis — dining-room tartan</title>
  <desc>Blue and sea-green checks framed in navy, with alternating buff and red overchecks in a two-over, two-under twill.</desc>
  <defs>
    <g id="row-8" fill="none" stroke-width="2" stroke-dasharray="4 4">
      <path d="M0 0h512" stroke-dashoffset="1"/>
      <path d="M0 2h512" stroke-dashoffset="7"/>
      <path d="M0 4h512" stroke-dashoffset="5"/>
      <path d="M0 6h512" stroke-dashoffset="3"/>
    </g>
    <g id="row-16"><use xlink:href="#row-8"/><use xlink:href="#row-8" y="8"/></g>
    <g id="row-32"><use xlink:href="#row-16"/><use xlink:href="#row-16" y="16"/></g>
    <g id="row-64"><use xlink:href="#row-32"/><use xlink:href="#row-32" y="32"/></g>
    <g id="row-128"><use xlink:href="#row-64"/><use xlink:href="#row-64" y="64"/></g>
    <g id="row-256"><use xlink:href="#row-128"/><use xlink:href="#row-128" y="128"/></g>
    <g id="row-512"><use xlink:href="#row-256"/><use xlink:href="#row-256" y="256"/></g>
    <g id="weave"><use xlink:href="#row-512"/><use xlink:href="#row-8" y="512"/></g>
    <clipPath id="rows-blue">
      <rect y="0" width="512" height="48"/>
      <rect y="208" width="512" height="96"/>
      <rect y="464" width="512" height="48"/>
    </clipPath>
    <clipPath id="rows-navy">
      <rect y="48" width="512" height="36"/>
      <rect y="172" width="512" height="36"/>
      <rect y="304" width="512" height="36"/>
      <rect y="428" width="512" height="36"/>
    </clipPath>
    <clipPath id="rows-green">
      <rect y="84" width="512" height="41"/>
      <rect y="131" width="512" height="41"/>
      <rect y="340" width="512" height="40"/>
      <rect y="388" width="512" height="40"/>
    </clipPath>
    <clipPath id="rows-buff">
      <rect y="125" width="512" height="6"/>
    </clipPath>
    <clipPath id="rows-red">
      <rect y="380" width="512" height="8"/>
    </clipPath>
  </defs>
  <g id="warp">
    <rect width="512" height="512" fill="#36546e"/>
    <rect x="48" width="36" height="512" fill="#172536"/>
    <rect x="84" width="41" height="512" fill="#2c514b"/>
    <rect x="125" width="6" height="512" fill="#ad9e80"/>
    <rect x="131" width="41" height="512" fill="#2c514b"/>
    <rect x="172" width="36" height="512" fill="#172536"/>
    <rect x="304" width="36" height="512" fill="#172536"/>
    <rect x="340" width="40" height="512" fill="#2c514b"/>
    <rect x="380" width="8" height="512" fill="#874f53"/>
    <rect x="388" width="40" height="512" fill="#2c514b"/>
    <rect x="428" width="36" height="512" fill="#172536"/>
  </g>
  <g id="weft">
    <use xlink:href="#weave" stroke="#36546e" clip-path="url(#rows-blue)"/>
    <use xlink:href="#weave" stroke="#172536" clip-path="url(#rows-navy)"/>
    <use xlink:href="#weave" stroke="#2c514b" clip-path="url(#rows-green)"/>
    <use xlink:href="#weave" stroke="#ad9e80" clip-path="url(#rows-buff)"/>
    <use xlink:href="#weave" stroke="#874f53" clip-path="url(#rows-red)"/>
  </g>
</svg>
