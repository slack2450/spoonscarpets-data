<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="400" height="400" viewBox="0 0 400 400">
  <title>The Elihu Yale, Wrexham — carpet repeat</title>
  <defs>
    <style>
      .ground { fill: #53616D }
      .shadow { fill: #424E59 }
      .umber  { fill: #8B7D69 }
      .ochre  { fill: #AE9A7C }
      .flax   { fill: #D8CDB5 }
      .ivory  { fill: #E6DECA }
    </style>

    <!-- Two blades in one quarter of a junction. -->
    <g id="corner">
      <path class="shadow" d="M5 10 Q54 8 109 11 C112 31 89 48 62 49 Q37 49 24 38
        C40 80 34 116 15 137 Q7 138 5 128 Z"/>
      <path class="flax" d="M8 14 C36 13 74 15 106 13 C108 29 88 45 63 46
        C46 47 34 42 22 34 C34 52 36 86 29 108 Q24 125 13 133
        Q8 132 8 124 C9 84 6 48 8 14 Z"/>
      <path class="ochre" d="M12 17 Q57 20 101 16 C74 24 41 23 18 22
        C22 51 19 97 13 124 Q15 66 12 17 Z"/>
      <path class="ivory" d="M23 28 Q66 38 99 22 C87 37 65 45 45 39 Q31 35 23 28 Z
        M23 44 Q39 88 18 121 Q29 84 23 44 Z"/>
    </g>

    <!-- Upper scroll and the cross growing inward from its crown. -->
    <g id="top-scroll">
      <path class="flax" d="M145 137 C129 134 114 124 111 106
        C108 85 122 61 140 43 C159 25 180 15 200 12
        C220 15 241 25 260 43 C278 61 292 85 289 106
        C286 124 271 134 255 137 L253 127
        C266 123 277 112 278 98 C280 79 265 56 245 47
        C234 41 223 46 215 55 C207 67 211 77 217 82
        Q224 88 232 76 L232 115 Q220 110 213 103
        Q211 115 215 131 Q200 135 185 131 Q189 115 187 103
        Q180 111 168 115 L168 76 Q176 88 183 82
        C189 77 193 67 185 55 C177 46 166 41 155 47
        C135 56 120 79 122 98 C123 112 134 123 147 127 Z"/>
      <path class="umber" d="M171 32 Q185 21 200 18 Q215 21 229 32
        C214 37 205 46 200 59 C195 46 186 37 171 32 Z"/>
      <path class="ground" d="M177 32 Q188 25 200 23 Q212 25 223 32
        Q207 39 200 52 Q193 39 177 32 Z"/>
      <path class="ochre" d="M200 57 Q203 76 207 89 Q216 95 227 87
        L227 104 Q215 99 205 97 Q203 112 208 126 L192 126
        Q197 110 195 97 Q185 99 173 104 L173 87 Q184 95 193 89 Z"/>
      <path class="ivory" d="M116 103 Q112 75 140 49 Q124 69 120 86 Z
        M284 103 Q288 75 260 49 Q276 69 280 86 Z
        M187 20 Q200 12 213 20 L200 18 Z
        M189 129 Q200 131 211 129 L209 126 Q200 128 191 126 Z"/>
      <path class="flax" d="M200 81 L204 92 L200 100 L196 92 Z"/>
    </g>

    <!-- A straight-sided cartouche ties together the two side volutes. -->
    <g id="side-scroll">
      <path class="flax" fill-rule="evenodd" d="M144 127
        C128 116 116 111 97 110 C80 108 68 117 57 129
        Q39 147 9 151 Q7 200 9 249 Q39 253 57 271
        C68 283 80 292 97 290 C116 289 128 284 144 273 L137 264
        C124 273 111 280 94 280 C70 282 48 260 48 239
        C48 222 60 209 69 212 Q80 215 77 226 L74 236 Q86 239 100 235
        Q96 224 98 215 Q107 218 116 219 Q118 200 116 181
        Q107 182 98 185 Q96 176 100 165 Q86 161 74 164
        L77 174 Q80 185 69 188 C60 191 48 178 48 161
        C48 140 70 118 94 120 C111 120 124 127 137 136 Z
        M16 159 Q27 158 36 152 C25 168 30 187 39 200
        C30 213 25 232 36 248 Q27 242 16 241 Z"/>
      <path class="ochre" d="M48 200 Q70 197 81 190 Q84 181 80 171
        L92 170 Q88 183 90 193 Q101 192 112 186
        Q110 200 112 214 Q101 208 90 207 Q88 217 92 230 L80 229
        Q84 219 81 210 Q70 203 48 200 Z"/>
      <path class="ivory" d="M12 155 Q28 154 42 146 Q34 154 15 158
        L12 190 Z M12 245 Q28 246 42 254 Q34 246 15 242 L12 210 Z
        M54 140 Q66 123 81 121 Q65 127 54 140 Z
        M54 260 Q66 277 81 279 Q65 273 54 260 Z"/>
      <path class="flax" d="M79 200 L86 195 L92 200 L86 205 Z"/>
    </g>

    <!-- Between the lobes, a small trefoil faces the central rosette. -->
    <g id="sprig">
      <path class="flax" d="M78 115 Q86 110 86 99 L88 91 L95 89 L99 76
        Q112 76 122 64 L119 78 Q115 102 128 119 L135 127
        Q146 122 139 109 Q149 105 156 112 Q165 122 155 135
        Q169 146 167 168 Q155 176 141 158 Q133 174 120 173
        Q109 169 111 149 Q117 155 121 152 Q128 144 118 134
        Q105 121 89 119 L77 122 Z"/>
      <path class="ground" d="M94 108 Q92 98 100 96 L103 84 L110 82
        Q107 100 116 115 Q103 109 94 108 Z"/>
      <path class="ochre" d="M118 120 Q134 132 145 132 Q154 123 145 113
        Q160 121 149 136 Q160 148 162 164 Q151 158 141 147
        Q136 163 120 167 Q129 157 130 144 Q128 132 118 120 Z"/>
      <path class="ivory" d="M140 109 Q154 106 157 119 Q150 112 143 114 Z
        M112 151 Q113 168 121 169 Q129 168 134 161 Q125 174 117 171 Q110 167 112 151 Z
        M146 144 Q158 150 163 164 Q152 155 146 144 Z"/>
    </g>

    <g id="petal">
      <path class="flax" d="M-7 -2 C-7 -9 -3 -12 1 -11 C6 -10 8 -6 7 1
        C7 7 3 11 -1 11 C-5 11 -8 6 -7 -2 Z"/>
      <ellipse class="ochre" cx="0" cy="0" rx="3" ry="4.2"/>
      <path class="ivory" d="M-5 -4 Q-5 -9 0 -9 Q-3 -7 -4 -3 Z"/>
    </g>
    <g id="flower">
      <ellipse class="umber" cx="200" cy="200" rx="37" ry="48"/>
      <ellipse class="shadow" cx="200" cy="200" rx="35" ry="46"/>
      <use xlink:href="#petal" transform="translate(200 168)"/>
      <use xlink:href="#petal" transform="translate(216 178) rotate(14)"/>
      <use xlink:href="#petal" transform="translate(224 200)"/>
      <use xlink:href="#petal" transform="translate(216 222) rotate(-14)"/>
      <use xlink:href="#petal" transform="translate(200 232)"/>
      <use xlink:href="#petal" transform="translate(184 222) rotate(14)"/>
      <use xlink:href="#petal" transform="translate(176 200)"/>
      <use xlink:href="#petal" transform="translate(184 178) rotate(-14)"/>
      <ellipse class="flax" cx="200" cy="200" rx="8.7" ry="12"/>
      <path class="ochre" d="M200 193 Q207 196 204 202 L200 207 L196 202 Q193 196 200 193 Z"/>
    </g>
  </defs>
  <rect class="ground" width="400" height="400"/>
  <use xlink:href="#corner"/>
  <use xlink:href="#corner" transform="translate(400) scale(-1 1)"/>
  <use xlink:href="#corner" transform="translate(0 400) scale(1 -1)"/>
  <use xlink:href="#corner" transform="translate(400 400) scale(-1 -1)"/>
  <use xlink:href="#top-scroll"/>
  <use xlink:href="#top-scroll" transform="translate(0 400) scale(1 -1)"/>
  <use xlink:href="#side-scroll"/>
  <use xlink:href="#side-scroll" transform="translate(400) scale(-1 1)"/>
  <use xlink:href="#sprig"/>
  <use xlink:href="#sprig" transform="translate(400) scale(-1 1)"/>
  <use xlink:href="#sprig" transform="translate(0 400) scale(1 -1)"/>
  <use xlink:href="#sprig" transform="translate(400 400) scale(-1 -1)"/>
  <use xlink:href="#flower"/>
</svg>
