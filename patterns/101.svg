<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
  <title>The New Crown, Southgate — rose and ring trellis</title>
  <defs>
    <!-- Each rail has eight small woven shoulders between grid crossings. -->
    <g id="rail" transform="scale(1 1.38)">
      <path d="M0 -3.3 H7 Q9 -3.3 11 -5 L14 -5.6 L16 -4.6 L18 -5.2 L21 -3.6 Q23 -3 26 -3.2 L32 -3.3 V3.3 H25 Q22 3.1 20 4.5 L16 5.6 L13 4.5 L11 5 L8 3.6 L0 3.3 Z"/>
    </g>
    <g id="rail-pair"><use xlink:href="#rail"/><use xlink:href="#rail" x="32"/></g>
    <g id="rail-four"><use xlink:href="#rail-pair"/><use xlink:href="#rail-pair" x="64"/></g>
    <g id="rail-full"><use xlink:href="#rail-four"/><use xlink:href="#rail-four" x="128"/></g>
    <g id="eye">
      <path fill="#966530" fill-rule="evenodd" d="M-1 -10 C5 -11 10 -6 10 0 C10 6 6 11 0 11 C-6 11 -10 6 -10 1 C-11 -5 -7 -10 -1 -10 Z M-1 -4 C-4 -4 -5 -1 -5 1 C-5 4 -2 6 1 5 C4 5 5 2 5 0 C5 -3 2 -5 -1 -4 Z"/>
      <path fill="#c39a76" d="M-9 3 C-11 -3 -7 -9 -1 -9 C3 -10 7 -7 9 -3 L6 -2 L5 0 C4 -4 1 -5 -2 -4 C-5 -4 -6 0 -5 3 L-6 5 Z"/>
      <path fill="#b3a06e" d="M2 6 Q6 5 7 1 L10 0 Q10 7 4 10 L1 9 Z"/>
    </g>
    <g id="trio">
      <use xlink:href="#eye" transform="translate(88 21) rotate(-20) scale(.94 1.04)"/>
      <use xlink:href="#eye" transform="translate(105 47) rotate(-12) scale(.90 1)"/>
      <use xlink:href="#eye" transform="translate(142 26) rotate(14) scale(.97 1.02)"/>
    </g>
  </defs>
  <rect width="256" height="256" fill="#762229"/>
  <!-- The split stalk links successive heads through the cross rails. -->
  <path fill="#461e20" d="M120 -1 L126 -1 C125 23 127 39 131 57 L134 91 L126 108 L117 111 L122 78 Q126 62 121 46 Q118 26 120 -1 Z M113 147 L128 149 Q122 164 125 181 L125 199 Q126 203 123 207 L117 207 C117 185 114 167 113 147 Z"/>
