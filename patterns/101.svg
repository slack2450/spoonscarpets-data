  <g fill="#b3a06e"><use xlink:href="#rail-full" transform="rotate(90)"/><use xlink:href="#rail-full" transform="translate(256) rotate(90)"/></g>
  <use xlink:href="#trio"/>
  <use xlink:href="#trio" transform="translate(253 253) rotate(180)"/>
  <use xlink:href="#eye" transform="translate(23 121) rotate(16) scale(.89 .97)"/>
  <use xlink:href="#eye" transform="translate(232 130) rotate(-12) scale(.89 .97)"/>
