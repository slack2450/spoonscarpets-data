  <path fill="#b78340" d="M112 114 Q115 108 112 103 L117 105 Q116 95 120 90 Q124 95 123 102 Q134 99 138 88 Q143 88 143 96 Q149 90 154 101 Q159 96 161 101 Q165 106 163 111 Q169 107 169 117 L173 119 L170 127 Q175 136 171 141 L172 145 Q171 148 167 148 Q168 154 160 153 Q158 159 151 155 Q147 160 143 157 Q137 162 134 157 Q130 160 126 156 Q122 159 119 158 Q120 145 115 139 Q109 130 112 114 Z"/>
