      <polygon fill="#745948" points="0,-74.354 64.5,-37.177 64.5,37.177 0,74.354 -64.5,37.177 -64.5,-37.177"/>
      <polygon fill="#C5AD97" points="0,-58.215 50.5,-29.108 50.5,29.108 0,58.215 -50.5,29.108 -50.5,-29.108"/>
      <polygon fill="#745948" points="0,-44.382 38.5,-22.191 38.5,22.191 0,44.382 -38.5,22.191 -38.5,-22.191"/>
      <polygon fill="#C5AD97" points="0,-25.938 22.5,-12.969 22.5,12.969 0,25.938 -22.5,12.969 -22.5,-12.969"/>
    </g>
  </defs>
  <rect width="192" height="332" fill="#C5AD97"/>
