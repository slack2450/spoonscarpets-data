<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="192" height="332" viewBox="0 0 192 332">
  <title>The Six Gold Martlets, Burgess Hill — honeycomb carpet repeat</title>
  <desc>Three walnut hexagonal bands surround a biscuit-coloured centre. Staggered rows share a narrow biscuit-coloured outer lattice.</desc>
  <defs>
    <g id="hexagon">
      <polygon fill="#745948" points="0,-103.750 90,-51.875 90,51.875 0,103.750 -90,51.875 -90,-51.875"/>
