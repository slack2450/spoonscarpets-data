<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="575" height="265" viewBox="0 0 575 265">
  <title>The Wallaw, Blyth — staggered slate-blue squares and stepped chevrons</title>
  <defs>
    <g id="stepped-band">
      <polygon points="81,145 153,144 149,83 267,66 263,269 71,275" fill="#aa8655" />
      <polygon points="78,163 155,147 161,91 211,75 190,192 80,210" fill="#743b33" />
      <polygon points="85,218 212,208 215,85 264,74 230,228 79,263" fill="#566e82" />
      <polygon points="78,269 235,239 264,77 252,257" fill="#743b33" />
    </g>
    <g id="square">
      <polygon points="-52,-53 73,-66 58,58 -66,70" fill="#566e82" />
      <polygon points="-69,-139 69,-129 75,-70 -62,-74" fill="#202526" />
      <polygon points="77,-62 127,-61 142,72 88,68" fill="#202526" />
      <polygon points="-65,76 66,84 75,131 -59,131" fill="#202526" />
      <polygon points="-133,-65 -76,-59 -70,65 -126,70" fill="#202526" />
      <polygon points="-140,-136 -85,-139 -89,-88 -135,-82" fill="#743b33" />
