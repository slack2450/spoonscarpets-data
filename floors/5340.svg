<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="0 0 512 512">
  <title>The West Quay, Brighton Marina</title>
  <desc>Rose and blue ceramic squares set in mitred oak, with scrolling vine borders and four-way floral centres.</desc>
  <defs>
    <!-- One rail. Grain follows the board and stops short of the mitres. -->
    <g id="rail">
      <path fill="#B88758" d="M.5 .2h255l-17.6 17.6H18.1Z"/>
      <g fill="#594638">
        <path d="M17 5c19-1 35-1 49 .1-18-.3-35 .6-49-.1Zm73 6c7-.1 12-2.5 17-2.5 7 0 10 2.7 24 2.6-14 .9-18-1.7-24-1.8-5-.1-10 2.2-17 1.7Z"/>
        <path d="M101 11.6q5-3.1 10 0-5 1.9-10 0Zm38-7c28 1.2 53-1.6 88-.1-34-.4-60 2.2-88 .1Zm24 9c13-.1 20-1.7 36-1.2-17 .2-24 2-36 1.2Z"/>
      </g>
    </g>
    <g id="frame">
      <rect width="256" height="256" fill="#594638"/>
      <use xlink:href="#rail"/>
      <use xlink:href="#rail" transform="rotate(90 128 128)"/>
      <use xlink:href="#rail" transform="rotate(180 128 128)"/>
      <use xlink:href="#rail" transform="rotate(270 128 128)"/>
    </g>
    <!-- Ceramic faces leave a narrow continuous joint between adjacent tiles. -->
    <rect id="face" x=".65" y=".65" width="42.7" height="42.7"/>
    <g id="side">
      <use xlink:href="#face" fill="#E9E1CC"/>
      <path fill="#D6AD62" d="M.65 1h42.7v1.4H.65Z"/>
      <path fill="#628795" d="M.65 2.4h42.7v2.4H.65Z"/>
      <path fill="#BB797B" d="M.65 29C8 29 9 12 20 12c9 0 11 16 23.35 15v2.8C30 31 27 15 20 15 11 15 11 31 .65 32Z"/>
      <path fill="#BB797B" d="M19 14q3 2.8 2.8 9l1.6.2q.8-6-2-9.5ZM8 24q-1 3-4 4l3.4.8ZM31 20q3.4 3.1 6 2.6l-3 2.2Z"/>
      <path fill="#628795" d="M22.8 20.2q3.8 2.2 3.3 5.1 3.1-1.6 5.1-.1-.4 3.8-4.6 5.2.7 3.1-2.4 6-3.7-1.7-4.2-5.1-3.2 1.1-5.7-1.5 1.1-3 4.4-3.4-1.2-3.2 1-5.2l2 2Z"/>
      <path fill="#628795" d="M.65 35q3.2-3.2 6.1-2.1.1 3.9-3.4 6.1 2.9-.7 4.9 1.9l-.4 2.45H.65Zm42.7 0q-3.2-3.2-6.1-2.1-.1 3.9 3.4 6.1-2.9-.7-4.9 1.9l.4 2.45h7.2Z"/>
      <path fill="#D6AD62" d="M19.9 13q-3.7-3.5-.9-6.7 3.9 2.5.9 6.7ZM9.8 24q4.1-.7 5.4 3.3-4.7 1-5.4-3.3Z"/>
    </g>
    <g id="corner">
      <use xlink:href="#face" fill="#E9E1CC"/>
      <path fill="#D6AD62" d="M1 43.35V1h42.35v1.4H2.4v40.95Z"/>
      <path fill="#628795" d="M2.4 43.35V2.4h40.95v2.4H4.8v38.55Z"/>
      <path fill="#BB797B" d="M.65 32c8.8-.2 10.1-7.8 11.6-12.4 3.2-10.3 12.9-11.6 20.3-3.4 2.5 2.8 5.2 11.3 10.8 11v2.7c-8.3.6-10.4-9.3-13.3-12.1-6.2-6.7-13-4.8-15.4 3.2C12.5 28.4 9.1 34.5.65 35Z"/>
      <path fill="#BB797B" d="M18 14q2 3 5.5 7.2l1.2-1q-4-4.3-4.2-7Z"/>
      <path fill="#628795" d="M24.4 18.9q3.6.1 4.9 3.8 2.3-1.4 4.5.2-.6 3.4-3.7 4.6 2.1 3.3.4 6.9-4.1.1-6.3-3.7-2.8 1.5-5.7-.5.2-3.4 3-4.8-2.3-2.6-1.5-5.4 2.5-.3 4.2 1.5Z"/>
      <path fill="#D6AD62" d="M15 15q-4.8-.9-5.6-5.6 4.8.4 5.6 5.6Z"/>
      <path fill="#628795" d="M37.5 43.35v-5.8h5.85v5.8Z"/>
    </g>
    <g id="petal">
      <path fill="#628795" d="M22 7q2.1 3.3 4.3 3.3l3.1-.3q-.5 4.9-4.7 5.1.9 3.1-2.7 4.9-3.6-1.8-2.7-4.9-4.2-.2-4.7-5.1l3.1.3Q20 10.3 22 7Z"/>
      <path fill="#D6AD62" d="M22 9.7q1.1 2.8 3.7 2.6-.6 1.9-2.7 1.9l-1 3-1-3q-2.1 0-2.7-1.9 2.5.2 3.7-2.6Z"/>
    </g>
    <g id="medallion">
      <use xlink:href="#face" fill="#E9E1CC"/>
      <path fill="#BB797B" d="M5 1.5h34L42.5 5v34L39 42.5H5L1.5 39V5Z"/>
      <path fill="none" stroke="#D6AD62" stroke-width="2" stroke-dasharray="2 2" d="M5.5 3h33L41 5.5v33L38.5 41h-33L3 38.5v-33Z"/>
      <path fill="#E9E1CC" d="M8 5h28l3 3v28l-3 3H8l-3-3V8Z"/>
      <use xlink:href="#petal"/>
      <use xlink:href="#petal" transform="rotate(90 22 22)"/>
      <use xlink:href="#petal" transform="rotate(180 22 22)"/>
      <use xlink:href="#petal" transform="rotate(270 22 22)"/>
      <path fill="#D6AD62" d="m22 19 3 3-3 3-3-3Z"/>
    </g>
    <g id="edge">
      <use xlink:href="#corner" x="18" y="18"/>
      <use xlink:href="#side" x="62" y="18"/>
      <use xlink:href="#side" x="106" y="18"/>
      <use xlink:href="#side" x="150" y="18"/>
    </g>
    <g id="rose">
      <use xlink:href="#frame"/>
      <use xlink:href="#edge"/>
      <use xlink:href="#edge" transform="rotate(90 128 128)"/>
      <use xlink:href="#edge" transform="rotate(180 128 128)"/>
      <use xlink:href="#edge" transform="rotate(270 128 128)"/>
      <g fill="#BB797B">
        <use xlink:href="#face" x="62" y="62"/><use xlink:href="#face" x="106" y="62"/><use xlink:href="#face" x="150" y="62"/>
        <use xlink:href="#face" x="62" y="106"/><use xlink:href="#face" x="150" y="106"/>
        <use xlink:href="#face" x="62" y="150"/><use xlink:href="#face" x="106" y="150"/><use xlink:href="#face" x="150" y="150"/>
      </g>
      <use xlink:href="#medallion" x="106" y="106"/>
    </g>
    <g id="blueRow" fill="#628795">
      <use xlink:href="#face" x="18"/><use xlink:href="#face" x="62"/><use xlink:href="#face" x="106"/>
      <use xlink:href="#face" x="150"/><use xlink:href="#face" x="194"/>
    </g>
    <g id="blueMiddle">
      <g fill="#628795"><use xlink:href="#face" x="18"/><use xlink:href="#face" x="194"/></g>
      <use xlink:href="#medallion" x="62"/><use xlink:href="#medallion" x="106"/><use xlink:href="#medallion" x="150"/>
    </g>
    <g id="blue">
      <use xlink:href="#frame"/>
      <use xlink:href="#blueRow" y="18"/><use xlink:href="#blueMiddle" y="62"/>
      <use xlink:href="#blueMiddle" y="106"/><use xlink:href="#blueMiddle" y="150"/><use xlink:href="#blueRow" y="194"/>
    </g>
  </defs>
  <rect width="512" height="512" fill="#594638"/>
  <use xlink:href="#rose" transform="matrix(1 1 -1 1 256 0)"/>
  <use xlink:href="#blue" transform="matrix(1 1 -1 1 0 -256)"/>
  <use xlink:href="#blue" transform="matrix(1 1 -1 1 512 -256)"/>
  <use xlink:href="#blue" transform="matrix(1 1 -1 1 0 256)"/>
  <use xlink:href="#blue" transform="matrix(1 1 -1 1 512 256)"/>
</svg>
